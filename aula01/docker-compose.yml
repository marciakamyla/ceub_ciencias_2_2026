

services:
  site-html:
    image: nginx:alpine
    ports:
      - "8088:80"
    command: >
      sh -c "wget -O /usr/share/nginx/html/index.html
      https://raw.githubusercontent.com/marciakamyla/ceub_ciencias_2_2026/desenvolvimento/aula01/.html
      && nginx -g 'daemon off;'"
    restart: unless-stopped
