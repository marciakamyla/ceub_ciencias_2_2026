<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
      <main>
        <section id="Formulário" class="py-5">
            <div class="container-fluid py-4">
                <div class="row justify-content-center">
                    <div class="col-md-8">
                        <div class="text-start mb-5">
                            <form action="post" class="bg-write border rounded-4 shadow-sm p-4 p-md5">
                                <div class="row g-4">
                                    <p class="text-primary mb-2"> Inscrição / Contrato</p>
                                    <div class="col-md-6">
                                       
                                        <label for="nome" class="form-label">Nome *</label>
                                        <input type="text" class="form-control">
                                    </div>
                                    <div class="col-md-6">
                                        <label for="" class="form-label">Sobrenome *</label>
                                        <input type="text" class="form-control">
                                    </div>
                                    <div class="col-md-6">
                                        <label for="" class="form-label">E-mail *</label>
                                        <input type="email" class="form-control">
                                    </div>
                                    <div class="col-md-6">
                                        <label for="" class="form-label">Telefone </label>
                                        <input type="text" class="form-control">
                                    </div>
                                    <div class="col-md-6">
                                        <label for="" class="form-label">CPF *</label>
                                        <input type="text" class="form-control">
                                    </div>
                                    <div class="col-md-6">
                                        <label for="" class="form-label">Data de Nascimento</label>
                                        <input type="date" class="form-control">
                                    </div>
                                    <div class="col-md-6">
                                        <label for="" class="form-label">Senha *</label>
                                        <input type="password" class="form-control">
                                    </div>
                                    <div class="col-md-6">
                                        <label for="" class="form-label">Função</label>
                                        <select class="form-select" aria-label="Default select example">
                                            <option selected>Escolha...</option>
                                            <option value="1">Arquiteto</option>
                                            <option value="2">Analista de negócio</option>
                                            <option value="3">Dev</option>
                                          </select>
                                    </div>
                                    <div class="col-md-12">
                                        <label for="" class="form-label">Usuário</label>
                                        <input type="text" class="form-control">
                                    </div>
                                    <div class="col-md-612">
                                            <label for="" class="form-label">Mensagem</label>
                                            <textarea class="form-control" name="" id="" rows="3"></textarea>
                                    </div>
                                    <div class="mb-3">
                                        <label for="formFile" class="form-label">Upload de currículo (PDF)</label>
                                        <input class="form-control" type="file" id="formFile">
                                      </div>
                                      <label for="">Quero receber novidades</label>
                                      <div class="form-check">
                                        <input class="form-check-input" type="radio" name="radioDefault" id="radioDefault1">
                                        <label class="form-check-label" for="radioDefault1">
                                          Contato por e-mail
                                        </label>
                                      </div>
                                      <div class="form-check">
                                        <input class="form-check-input" type="radio" name="radioDefault" id="radioDefault2" checked>
                                        <label class="form-check-label" for="radioDefault2">
                                          Contato por telefone
                                        </label>
                                      </div>
                                    <div class="col-md-6">
                                        <button type="submit" class="btn btn-primary px-4">Enviar</button>
                                    </div>
                                    <div class="col-md-6">
                                        <button type="reset" class="btn px-4">Limpar</button>
                                    </div>
                                </div>

                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </section>
      </main>
</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</html>
